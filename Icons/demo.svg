<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- VOFocus Demo: a list with VoiceOver's focus cursor on one row. Source for DemoApp/Assets.xcassets. -->
