<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>VOFocus Demo</title>
  <!-- The VOFocus logo (docs/brand/icon.svg) on a square tile, since iOS rounds app
       icons itself. Source for DemoApp/Assets.xcassets. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2E1065" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(0 56)">
  <!-- Row 1 -->
  <g opacity="0.82">
    <rect x="212" y="292" width="600" height="124" rx="62" fill="#FFFFFF"/>
    <circle cx="286" cy="354" r="38" fill="#7C3AED"/>
    <text x="286" y="369" text-anchor="middle" font-family="Avenir Next" font-weight="700" font-size="44" fill="#FFFFFF">1</text>
    <rect x="350" y="340" width="250" height="28" rx="14" fill="#C4B5FD"/>
  </g>

  <!-- Row 3 -->
  <g opacity="0.82">
    <rect x="212" y="628" width="600" height="124" rx="62" fill="#FFFFFF"/>
    <circle cx="286" cy="690" r="38" fill="#7C3AED"/>
    <text x="286" y="705" text-anchor="middle" font-family="Avenir Next" font-weight="700" font-size="44" fill="#FFFFFF">3</text>
    <rect x="350" y="676" width="200" height="28" rx="14" fill="#C4B5FD"/>
  </g>

  <!-- Row 2, under the VoiceOver cursor -->
  <g filter="url(#shadow)">
    <rect x="212" y="460" width="600" height="124" rx="62" fill="#FFFFFF"/>
    <circle cx="286" cy="522" r="38" fill="#EC4899"/>
    <text x="286" y="537" text-anchor="middle" font-family="Avenir Next" font-weight="700" font-size="44" fill="#FFFFFF">2</text>
    <rect x="350" y="508" width="300" height="28" rx="14" fill="#A78BFA"/>
  </g>

  <!-- VoiceOver focus cursor: dark outer ring with a white inner line -->
  <rect x="186" y="434" width="652" height="176" rx="88" fill="none" stroke="#1E1B4B" stroke-width="22"/>
  <rect x="200" y="448" width="624" height="148" rx="74" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Sparkle on the cursor -->
  <path d="M836 418 L848 450 L880 462 L848 474 L836 506 L824 474 L792 462 L824 450 Z" fill="#FDE047"/>
  <circle cx="884" cy="404" r="9" fill="#FDE047"/>

  <!-- Speech bubble: VoiceOver talking -->
  <g filter="url(#shadow)">
    <path d="M640 146 h176 a52 52 0 0 1 52 52 v66 a52 52 0 0 1 -52 52 h-98 l-52 46 v-46 h-26 a52 52 0 0 1 -52 -52 v-66 a52 52 0 0 1 52 -52 z" fill="#FFFFFF"/>
  </g>
  <g fill="none" stroke="#8B5CF6" stroke-width="16" stroke-linecap="round">
    <line x1="676" y1="216" x2="676" y2="246"/>
    <line x1="716" y1="192" x2="716" y2="270"/>
    <line x1="756" y1="206" x2="756" y2="256"/>
    <line x1="796" y1="184" x2="796" y2="278"/>
    <line x1="834" y1="214" x2="834" y2="248"/>
  </g>
  </g>
</svg>
