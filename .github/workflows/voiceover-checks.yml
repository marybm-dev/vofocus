# Runs the VoiceOver scenarios on an iOS Simulator and uploads a JUnit report.
#
# It only runs when started by hand (Actions → VoiceOver checks → Run workflow).
# Uncomment `pull_request` to run it on every pull request. On private repositories,
# macOS runner minutes count against your plan at a higher rate than Linux, so check
# GitHub's current Actions pricing first.
#
# Runs on GitHub's `xcode-27` image (macOS 27 with Xcode 27.x); `macos-latest` only has
# Xcode 26. It picks the newest Xcode 27 on the image unless XCODE_APP is set. To check
# your own app, replace the last steps with a build of your app and
# `vofocus run <your scenarios> --junit …`.
name: VoiceOver checks

on:
  workflow_dispatch:
    inputs:
      audio:
        description: "Also record what VoiceOver says (experimental; needs a self-hosted Mac, see docs/AUDIO.md)"
        type: boolean
        default: false
  # pull_request:

# The workflow only reads the repository and uploads artifacts.
permissions:
  contents: read

jobs:
  scenarios:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SIM_NAME: iPhone 18 Pro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          # Newest Xcode 27 by version number (names look like Xcode_27.app, Xcode_27.1.app,
          # Xcode_27.2_Release_Candidate.app).
          newest=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | awk -F'Xcode_' '
            { split($2, v, /[^0-9]+/); printf "%05d%05d%05d %s\n", v[1], v[2], v[3], $0 }' | sort | tail -1 | cut -d" " -f2-)
          XCODE_APP="${XCODE_APP:-$newest}"
          if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
            echo "::error::No Xcode 27 on this runner image. Available:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      - name: Make sure an iOS 27 Simulator is available
        run: |
          xcrun simctl list runtimes | grep -q "iOS 27" || xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes | grep "iOS 27"
          # Use SIM_NAME if the image has it; otherwise the first iPhone on the newest iOS 27 runtime.
          if [[ -z "$(bash -c '. scripts/lib.sh && sim_udid')" ]]; then
            name=$(xcrun simctl list devices available | awk '
              /^-- iOS 27/ { split($3, v, "."); version = v[1] * 10000 + v[2] * 100 + v[3]; ios27 = 1; next }
              /^-- / { ios27 = 0; next }
              ios27 && /iPhone/ && version > best { best = version; row = $0; sub(/^ +/, "", row); sub(/ \(.*/, "", row); pick = row }
              END { print pick }')
            [[ -n "$name" ]] || { echo "::error::No iPhone Simulator on an iOS 27 runtime"; exit 1; }
            echo "$SIM_NAME isn't on this image; using $name"
            echo "SIM_NAME=$name" >> "$GITHUB_ENV"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Note on audio
        if: inputs.audio
        # GitHub-hosted runners record silence: nobody can grant macOS's system audio
        # permission there, and on-device transcription isn't available. See
        # docs/AUDIO.md ("In CI"). Use a self-hosted Mac where the permission is granted.
        run: echo "::warning::Audio usually records silence on GitHub-hosted runners (see docs/AUDIO.md)."

      - name: Run the scenarios
        # Fails rather than waits if a permission prompt nobody can answer appears.
        timeout-minutes: 25
        run: |
          audio=()
          [[ "${{ inputs.audio }}" == "true" ]] && audio=(--audio build/audio)
          scripts/demo.sh run scenarios/demo --retries 2 --junit build/vofocus-junit.xml "${audio[@]}"

      - name: Upload the report and runner log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vofocus-report
          path: |
            build/vofocus-junit.xml
            build/runner-mcp.log
            build/audio
          if-no-files-found: ignore
