<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <title>VOFocus: real VoiceOver focus order, verified by agents and CI</title>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0B2E"/>
      <stop offset="1" stop-color="#2A1460"/>
    </linearGradient>
    <radialGradient id="banner-glow" cx="0.24" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#banner-bg)"/>
  <rect width="1280" height="640" fill="url(#banner-glow)"/>

  <!-- Icon -->
  <image href="icon.svg" x="96" y="140" width="360" height="360"/>

  <!-- Wordmark and pitch -->
  <text x="540" y="292" font-family="Avenir Next" font-weight="700" font-size="112" letter-spacing="-2" fill="url(#word)">VOFocus</text>
  <text x="544" y="360" font-family="Avenir Next" font-weight="500" font-size="36" fill="#E9E5FF">Real VoiceOver focus order,</text>
  <text x="544" y="408" font-family="Avenir Next" font-weight="500" font-size="36" fill="#E9E5FF">verified by agents and CI.</text>

  <!-- Chips -->
  <g font-family="Avenir Next" font-weight="600" font-size="22" fill="#C4B5FD">
    <rect x="544" y="448" width="104" height="44" rx="22" fill="none" stroke="#6D5BD0" stroke-width="2"/>
    <text x="596" y="477" text-anchor="middle">iOS 27</text>
    <rect x="664" y="448" width="136" height="44" rx="22" fill="none" stroke="#6D5BD0" stroke-width="2"/>
    <text x="732" y="477" text-anchor="middle">XCUITest</text>
    <rect x="816" y="448" width="88" height="44" rx="22" fill="none" stroke="#6D5BD0" stroke-width="2"/>
    <text x="860" y="477" text-anchor="middle">MCP</text>
  </g>
</svg>
